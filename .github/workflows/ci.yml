name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run guard
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench

  e2e:
    # Playwright drives the *packaged* app (electron-builder --dir output) on every OS.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-latest,
              bin: apps/desktop/release/linux-unpacked/beacon,
              pack: '--linux --dir',
            }
          - {
              os: macos-latest,
              bin: apps/desktop/release/mac-arm64/Beacon.app/Contents/MacOS/Beacon,
              pack: '--mac --arm64 --dir -c.mac.target=dir',
            }
          - {
              os: windows-latest,
              bin: apps/desktop/release/win-unpacked/Beacon.exe,
              pack: '--win --dir',
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - run: npx electron-builder ${{ matrix.pack }} --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Playwright (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npx playwright test
        env:
          BEACON_E2E_BIN: ${{ github.workspace }}/${{ matrix.bin }}
      - name: Playwright
        if: runner.os != 'Linux'
        run: npx playwright test
        env:
          BEACON_E2E_BIN: ${{ github.workspace }}/${{ matrix.bin }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results
