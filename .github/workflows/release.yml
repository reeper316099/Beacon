name: Release
# Push a tag like v0.1.0 to build installers for all three platforms and publish a GitHub release.
# Builds are UNSIGNED (see docs/PLATFORMS.md for how to add signing and notarization).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: --win }
          - { os: macos-latest, args: --mac }
          - { os: ubuntu-latest, args: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run guard
      - run: npm test
      - run: npm run icon
      - run: npm run build
      - name: Package
        # electron-builder finds the homepage (required for .deb/.rpm) from a .git folder next to
        # package.json, which this monorepo layout doesn't have; take it from the repo running the job.
        # The version of the installers (file names and the app's own version) comes from the tag,
        # so package.json does not have to be bumped for a release.
        # --publish never: this job only builds; the release job below publishes.
        shell: bash
        run: >
          npx electron-builder ${{ matrix.args }} --publish never
          -c.extraMetadata.homepage="$HOMEPAGE"
          -c.extraMetadata.version="${VERSION#v}"
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A release may already exist for the tag (e.g. created in the GitHub UI): then attach to it.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Beacon $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Beacon $GITHUB_REF_NAME" \
              --notes-file docs/RELEASE_NOTES.md \
              --verify-tag
          fi
